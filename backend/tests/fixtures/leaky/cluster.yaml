# A workload that leaks credentials in every place the redactor is expected to cover.
# All credentials are made up; test_redaction.py lists them as canaries.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: shop
  annotations:
    deployment.kubernetes.io/revision: "4"
    kubectl.kubernetes.io/last-applied-configuration: >
      {"apiVersion":"apps/v1","kind":"Deployment","spec":{"template":{"spec":{"containers":[{"env":[{"name":"DB_PASSWORD","value":"S3cr3t-Passw0rd!"}]}]}}}}
  managedFields:
    - manager: kubectl-client-side-apply
      operation: Update
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: registry.example.com/shop/payments-api:2.8.1
          args:
            - --listen=:8080
            - --jwt-secret=hs256-signing-key-123
            - --smtp-password
            - smtp-Pa55-separate-arg
          env:
            - name: LOG_LEVEL
              value: debug
            - name: DB_PASSWORD
              value: S3cr3t-Passw0rd!
            - name: DATABASE_URL
              value: postgresql://payments:pg-Pa55word@payments-db.shop.svc:5432/payments?sslmode=require
            - name: REDIS_URL
              value: redis://:r3dis-pw@redis.shop.svc:6379/0
            - name: STRIPE_API_KEY
              value: sk_live_51MqxExampleKeyValue00
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payments-api-token
                  key: token
          ports:
            - containerPort: 8080
      volumes:
        - name: tls
          secret:
            secretName: payments-tls
