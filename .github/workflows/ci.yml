name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Runs the eval harness in --fake mode against real PostgreSQL, so the storage path
  # is exercised on the production database engine and not only on SQLite.
  eval-harness:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kube_explorer
          POSTGRES_PASSWORD: kube_explorer
          POSTGRES_DB: kube_explorer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kube_explorer"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://kube_explorer:kube_explorer@localhost:5432/kube_explorer
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python ../faults/tools/synthesize_captures.py
      - name: Captures in git match the synthesizer
        run: git diff --exit-code -- ../faults
      - run: python -m app.eval --fake

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
        working-directory: deploy/terraform
      - run: terraform init -backend=false
        working-directory: deploy/terraform
      - run: terraform validate
        working-directory: deploy/terraform
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/kube-explorer
      - run: helm lint deploy/helm/kube-explorer -f deploy/helm/kube-explorer/values-kind.yaml
      - run: helm template kube-explorer deploy/helm/kube-explorer > /dev/null
      - name: Trivy misconfiguration scan (Helm chart and Terraform)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Shell scripts parse
        run: |
          for script in deploy/kind/*.sh faults/*.sh faults/*/revert.sh; do
            bash -n "$script"
          done

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          load: true
          tags: kube-explorer-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kube-explorer-${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
