apiVersion: v1
kind: Namespace
metadata:
  name: fault-missing-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: fault-missing-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
        - name: billing
          image: nginx:1.27-alpine
          env:
            - name: DB_HOST
              value: billing-db.fault-missing-secret.svc.cluster.local
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-db-credentials
                  key: password
