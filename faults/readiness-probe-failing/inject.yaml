apiVersion: v1
kind: Namespace
metadata:
  name: fault-readiness-probe-failing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: fault-readiness-probe-failing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: fault-readiness-probe-failing
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 80
