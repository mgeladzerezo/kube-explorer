apiVersion: v1
kind: Namespace
metadata:
  name: fault-bad-image-tag
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: fault-bad-image-tag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: nginx:1.27.99-alpine
          ports:
            - containerPort: 80
