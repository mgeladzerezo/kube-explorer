apiVersion: v1
kind: Namespace
metadata:
  name: fault-pvc-pending
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: fault-pvc-pending
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  namespace: fault-pvc-pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      containers:
        - name: media
          image: nginx:1.27-alpine
          volumeMounts:
            - name: uploads
              mountPath: /usr/share/nginx/html/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
