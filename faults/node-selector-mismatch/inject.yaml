apiVersion: v1
kind: Namespace
metadata:
  name: fault-node-selector-mismatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: fault-node-selector-mismatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      nodeSelector:
        disktype: ssd
      containers:
        - name: search
          image: nginx:1.27-alpine
