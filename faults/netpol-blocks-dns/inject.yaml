apiVersion: v1
kind: Namespace
metadata:
  name: fault-netpol-blocks-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: fault-netpol-blocks-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                wget -q -T 5 -O /dev/null http://payments.fault-netpol-blocks-dns.svc.cluster.local/ \
                  && echo "payments reachable" || echo "payments request failed"
                sleep 10
              done
          readinessProbe:
            exec:
              command: ["nslookup", "kubernetes.default.svc.cluster.local"]
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: fault-netpol-blocks-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: fault-netpol-blocks-dns
spec:
  selector:
    app: payments
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-egress
  namespace: fault-netpol-blocks-dns
spec:
  podSelector:
    matchLabels:
      app: checkout
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: payments
      ports:
        - protocol: TCP
          port: 80
