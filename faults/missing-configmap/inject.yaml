apiVersion: v1
kind: Namespace
metadata:
  name: fault-missing-configmap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-proxy
  namespace: fault-missing-configmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-proxy
  template:
    metadata:
      labels:
        app: edge-proxy
    spec:
      containers:
        - name: proxy
          image: nginx:1.27-alpine
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: edge-proxy-conf
