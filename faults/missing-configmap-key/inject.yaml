apiVersion: v1
kind: Namespace
metadata:
  name: fault-missing-configmap-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fault-missing-configmap-key
data:
  LOG_LEVEL: info
  FEATURE_FLAGS: checkout-v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: fault-missing-configmap-key
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: nginx:1.27-alpine
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MODE
