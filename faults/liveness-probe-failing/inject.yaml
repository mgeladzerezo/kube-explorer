apiVersion: v1
kind: Namespace
metadata:
  name: fault-liveness-probe-failing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fault-liveness-probe-failing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
