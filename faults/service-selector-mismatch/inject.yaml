apiVersion: v1
kind: Namespace
metadata:
  name: fault-service-selector-mismatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fault-service-selector-mismatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fault-service-selector-mismatch
spec:
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80
