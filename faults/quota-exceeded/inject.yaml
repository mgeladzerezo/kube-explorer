apiVersion: v1
kind: Namespace
metadata:
  name: fault-quota-exceeded
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: fault-quota-exceeded
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fault-quota-exceeded
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
