apiVersion: v1
kind: Namespace
metadata:
  name: fault-unschedulable-resources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: fault-unschedulable-resources
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 500m
              memory: 64Gi
