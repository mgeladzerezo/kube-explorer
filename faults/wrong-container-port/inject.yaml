apiVersion: v1
kind: Namespace
metadata:
  name: fault-wrong-container-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: fault-wrong-container-port
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
        - name: docs
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: fault-wrong-container-port
spec:
  selector:
    app: docs
  ports:
    - port: 80
      targetPort: 8080
