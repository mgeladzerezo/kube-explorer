apiVersion: v1
kind: Namespace
metadata:
  name: fault-crashloop-bad-command
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: fault-crashloop-bad-command
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
    spec:
      containers:
        - name: notifier
          image: busybox:1.36
          command: ["/usr/local/bin/notifier"]
          args: ["--listen", ":8080"]
