{{- if .Values.secret.externalSecret.enabled }}
{{- $es := .Values.secret.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "kube-explorer.name" . }}
  labels:
    {{- include "kube-explorer.labels" . | nindent 4 }}
  annotations:
    # The migration hook needs DATABASE_URL, so the Secret must exist before it runs.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStore.kind }}
    name: {{ $es.secretStore.name }}
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ $es.properties.anthropicApiKey }}
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ $es.properties.databaseUrl }}
{{- end }}
