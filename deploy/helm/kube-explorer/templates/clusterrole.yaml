# Read-only, and only the resources listed in backend/app/kube/reader.py (a backend test
# compares the two). Secrets are deliberately not readable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-explorer.name" . }}-reader
  labels:
    {{- include "kube-explorer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "persistentvolumeclaims", "configmaps", "resourcequotas", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-explorer.name" . }}-reader
  labels:
    {{- include "kube-explorer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-explorer.name" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-explorer.name" . }}
    namespace: {{ .Release.Namespace }}
